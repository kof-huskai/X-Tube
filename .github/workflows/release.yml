name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          V=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "manifest version $V != tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build zip (extension files only)
        run: |
          zip -r "XTube-${GITHUB_REF_NAME}.zip" manifest.json *.js *.css *.html icons
      - uses: softprops/action-gh-release@v2
        with:
          files: XTube-*.zip
          generate_release_notes: true
